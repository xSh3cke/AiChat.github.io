<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yx Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Yx Agent</h1></header>

  <main id="chat">

  </form>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
