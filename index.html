<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yx Agent</title>
<style>
  :root {
    --bg: #fafafa; --fg: #111; --muted: #888; --line: #e5e5e5;
    --user: #111; --user-fg: #fff; --bot: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0c; --fg: #eee; --muted: #777; --line: #222; --user: #eee; --user-fg: #111; --bot: #181818; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 720px; padding: 20px 16px 8px; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  #chat {
    flex: 1; width: 100%; max-width: 720px; overflow-y: auto;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-fg); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .empty { margin: auto; color: var(--muted); }
  form {
    width: 100%; max-width: 720px; padding: 12px 16px 20px;
    display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    border-radius: 14px; padding: 11px 14px; font: inherit; max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--muted); }
  button {
    border: 0; background: var(--fg); color: var(--bg); width: 42px; height: 42px;
    border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: default; }
  .dots::after { content: "…"; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .2; } }
</style>
</head>
<body>
  <header><h1>Yx Agent</h1></header>
  <div id="chat"><div class="empty" id="empty">¿En qué te ayudo?</div></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe un mensaje…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Enviar">↑</button>
  </form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];
let busy = false;

function add(role, text) {
  document.getElementById("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  input.value = ""; input.style.height = "auto";

  add("user", text);
  history.push({ role: "user", content: text });
  const bot = add("bot dots", "");
  let reply = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error((await res.text()) || res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) {
            reply += delta;
            bot.classList.remove("dots");
            bot.textContent = reply;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    bot.classList.remove("dots");
    bot.textContent = "Error: " + err.message;
    history.pop();
  } finally {
    bot.classList.remove("dots");
    busy = false; send.disabled = false; input.focus();
  }
});
</script>
</body>
</html>
